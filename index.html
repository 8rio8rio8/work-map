<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>関西エリア 就業先マップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f0f2f7;
    --surface: #ffffff;
    --surface2: #f5f7fb;
    --accent: #3a7ef5;
    --accent2: #d4891a;
    --accent3: #27ae72;
    --text: #1a1d2e;
    --text-muted: #7a7f96;
    --border: #dde1f0;
    --danger: #e53935;
    --admin: #d4891a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── 入場パスワード画面 ── */
  #entryScreen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .entry-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px;
    width: 360px;
    max-width: 90vw;
    text-align: center;
    animation: slideUp 0.3s ease;
  }
  .entry-logo {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .entry-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .entry-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 28px;
    line-height: 1.6;
  }
  .entry-icon {
    font-size: 48px;
    margin-bottom: 20px;
    display: block;
  }
  .pw-input-wrap { position: relative; margin-bottom: 8px; }
  .pw-input-wrap input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 40px 12px 16px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 0.15em;
    text-align: center;
    outline: none;
    transition: border-color 0.15s;
  }
  .pw-input-wrap input:focus { border-color: var(--accent); }
  .pw-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; }
  .entry-error { font-size: 12px; color: var(--danger); min-height: 18px; margin-bottom: 12px; }
  .entry-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .entry-btn:hover { opacity: 0.85; }

  /* ── メイン画面（最初は非表示） ── */
  #mainApp { display: none; flex-direction: column; height: 100vh; }
  #mainApp.visible { display: flex; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; height: 54px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; z-index: 1000; }
  .logo { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: var(--accent); text-transform: uppercase; white-space: nowrap; }
  .header-title { font-size: 13px; color: var(--text-muted); }
  .header-stats { margin-left: auto; display: flex; gap: 20px; align-items: center; }
  .stat { display: flex; flex-direction: column; align-items: flex-end; }
  .stat-value { font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; color: var(--accent); line-height: 1; }
  .stat-label { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .legend { display: flex; gap: 14px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; }
  .admin-badge { display: flex; align-items: center; gap: 6px; background: rgba(247,201,72,0.12); border: 1px solid rgba(247,201,72,0.3); border-radius: 20px; padding: 4px 10px; font-size: 11px; color: var(--admin); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .admin-badge:hover { background: rgba(247,201,72,0.2); }
  .admin-badge.active { background: rgba(247,201,72,0.2); border-color: var(--admin); }

  .main { display: flex; flex: 1; overflow: hidden; }
  .sidebar { width: 300px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
  .sidebar-top { padding: 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .sidebar-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
  .search-box { display: flex; align-items: center; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; gap: 7px; }
  .search-box input { background: none; border: none; outline: none; color: var(--text); font-family: inherit; font-size: 13px; width: 100%; }
  .search-box input::placeholder { color: var(--text-muted); }
  .filter-section { display: flex; flex-direction: column; gap: 5px; }
  .filter-section-label { font-size: 10px; color: var(--text-muted); }
  .filter-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .filter-btn { padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); font-family: inherit; font-size: 10px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(79,142,247,0.12); }

  .company-list { flex: 1; overflow-y: auto; padding: 8px; }
  .company-list::-webkit-scrollbar { width: 3px; }
  .company-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .company-card { padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 5px; cursor: pointer; transition: all 0.15s; background: var(--surface2); }
  .company-card:hover { border-color: var(--accent); }
  .company-card.selected { border-color: var(--accent); background: rgba(79,142,247,0.08); }
  .card-top { display: flex; align-items: flex-start; gap: 9px; }
  .card-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; background: #4f8ef7; }
  .card-info { flex: 1; min-width: 0; }
  .card-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-station { font-size: 11px; color: var(--accent2); margin-top: 2px; }
  .card-meta { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
  .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(79,142,247,0.15); color: var(--accent); white-space: nowrap; }
  .tag.green { background: rgba(93,232,160,0.15); color: var(--accent3); }
  .tag.yellow { background: rgba(247,201,72,0.15); color: var(--accent2); }
  .tag.purple { background: rgba(167,139,250,0.15); color: #a78bfa; }

  .add-btn { margin: 10px; padding: 9px; border-radius: 10px; border: 1px dashed var(--border); background: none; color: var(--text-muted); font-family: inherit; font-size: 13px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .add-btn:hover { border-color: var(--accent); color: var(--accent); }

  #map { flex: 1; }
  .leaflet-tile-pane { filter: none; }
  .leaflet-marker-shadow { display: none; }

  #detailPanel { display: none; position: absolute; bottom: 16px; right: 16px; width: 280px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; z-index: 500; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
  .detail-row { display: flex; gap: 8px; font-size: 12px; margin-bottom: 5px; align-items: flex-start; }
  .detail-icon { color: var(--accent2); width: 16px; flex-shrink: 0; margin-top: 1px; }
  .detail-val { color: var(--text); flex: 1; line-height: 1.5; }
  .dist-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(93,232,160,0.15); color: var(--accent3); border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 700; margin-top: 8px; }
  .panel-actions { display: flex; gap: 6px; margin-top: 11px; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); z-index: 9999; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 460px; max-width: 92vw; max-height: 90vh; overflow-y: auto; padding: 22px; animation: slideUp 0.18s ease; }
  .modal::-webkit-scrollbar { width: 3px; }
  .modal::-webkit-scrollbar-thumb { background: var(--border); }
  @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal h3 { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
  .form-group { margin-bottom: 12px; }
  .form-label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 5px; display: block; }
  .form-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 11px; color: var(--text); font-family: inherit; font-size: 13px; outline: none; transition: border-color 0.15s; resize: vertical; }
  .form-input:focus { border-color: var(--accent); }
  textarea.form-input { min-height: 70px; line-height: 1.6; }
  .form-row { display: flex; gap: 9px; }
  .form-row .form-group { flex: 1; }
  .modal-actions { display: flex; gap: 7px; margin-top: 18px; }
  .btn-primary { flex: 1; padding: 9px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: opacity 0.15s; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary { flex: 1; padding: 9px; border-radius: 8px; border: 1px solid var(--border); background: none; color: var(--text-muted); font-family: inherit; font-size: 13px; cursor: pointer; }
  .btn-secondary:hover { border-color: var(--text-muted); color: var(--text); }
  .btn-danger { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--danger); background: none; color: var(--danger); font-family: inherit; font-size: 13px; cursor: pointer; }
  .geocode-btn { margin-top: 6px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); background: rgba(79,142,247,0.1); color: var(--accent); font-family: inherit; font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .geocode-btn:hover { background: rgba(79,142,247,0.2); }
  .geocode-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .coords-display { font-size: 11px; color: var(--accent3); margin-top: 5px; font-family: 'Space Mono', monospace; min-height: 16px; }
  .hint { font-size: 11px; color: var(--text-muted); margin-top: 12px; line-height: 1.6; background: var(--surface2); border-radius: 8px; padding: 8px 10px; }
  .section-divider { border: none; border-top: 1px solid var(--border); margin: 14px 0 12px; }
  .job-suggestions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .job-chip { padding: 4px 9px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); font-size: 11px; cursor: pointer; transition: all 0.12s; }
  .job-chip:hover { border-color: var(--accent3); color: var(--accent3); }

  /* 管理者パスワードモーダル */
  .pw-modal { width: 340px; text-align: center; }
  .pw-modal h3 { margin-bottom: 8px; }
  .pw-subtitle { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }
  .pw-error { font-size: 12px; color: var(--danger); margin-top: 8px; min-height: 18px; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; font-size: 13px; z-index: 99999; opacity: 0; transition: opacity 0.2s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ══ 入場パスワード画面 ══ -->
<div id="entryScreen">
  <div class="entry-box">
    <div class="entry-logo">STAFF MAP</div>
    <span class="entry-icon">🗺️</span>
    <div class="entry-title">関西エリア 就業先マップ</div>
    <div class="entry-subtitle">限定公開です<br>パスワードを入力してください</div>
    <div class="pw-input-wrap">
      <input type="password" id="entryPwInput" placeholder="パスワード" onkeydown="if(event.key==='Enter')checkEntryPassword()">
      <button class="pw-toggle" onclick="toggleEntryPw()">👁</button>
    </div>
    <div class="entry-error" id="entryError"></div>
    <button class="entry-btn" onclick="checkEntryPassword()">WELCOME</button>
  </div>
</div>

<!-- ══ メインアプリ ══ -->
<div id="mainApp">
  <header>
    <div class="logo">STAFF MAP</div>
    <div class="header-title">関西エリア 就業先マップ</div>
    <div class="legend" style="margin-left:12px">
      <div class="legend-item"><div class="legend-dot" style="background:#4f8ef7"></div>就業先</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f7c948"></div>最寄駅</div>
    </div>
    <div class="header-stats">
      <div class="stat"><div class="stat-value" id="statTotal">0</div><div class="stat-label">就業先数</div></div>
      <div class="stat"><div class="stat-value" id="statStations">0</div><div class="stat-label">登録駅数</div></div>
    </div>
    <button class="admin-badge" id="adminBadge" onclick="handleAdminClick()">
      <span id="adminIcon">🔒</span>
      <span id="adminLabel">管理者</span>
    </button>
  </header>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-label">就業先リスト</div>
        <div class="search-box">
          <span style="color:var(--text-muted);font-size:12px">🔍</span>
          <input type="text" id="searchInput" placeholder="会社名・駅名・業務内容で検索…">
        </div>
        <div class="filter-section">
          <div class="filter-section-label">業務内容で絞り込み</div>
          <div class="filter-row" id="filterRow">
            <button class="filter-btn active" onclick="setFilter('all',this)">すべて</button>
          </div>
        </div>
      </div>
      <div class="company-list" id="companyList"></div>
      <button class="add-btn" id="addBtn" style="display:none" onclick="openAddModal()">＋ 就業先を追加</button>
    </div>
    <div id="map"></div>
  </div>
</div>

<!-- 詳細パネル -->
<div id="detailPanel">
  <div id="detailContent"></div>
  <div class="panel-actions" id="detailActions"></div>
</div>

<!-- 管理者パスワードモーダル -->
<div class="modal-overlay" id="adminPwOverlay">
  <div class="modal pw-modal">
    <h3>🔐 管理者ログイン</h3>
    <div class="pw-subtitle">管理者パスワードを入力してください</div>
    <div class="pw-input-wrap">
      <input class="form-input" id="adminPwInput" type="password" placeholder="管理者パスワード" onkeydown="if(event.key==='Enter')checkAdminPassword()" style="text-align:center;letter-spacing:0.1em">
    </div>
    <div class="pw-error" id="adminPwError"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeAdminPwModal()">キャンセル</button>
      <button class="btn-primary" onclick="checkAdminPassword()">ログイン</button>
    </div>
  </div>
</div>

<!-- 就業先追加・編集モーダル -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">就業先を追加</h3>
    <div class="form-group">
      <label class="form-label">会社名 *</label>
      <input class="form-input" id="f_name" type="text" placeholder="例：〇〇倉庫株式会社">
    </div>
    <div class="form-group">
      <label class="form-label">事業所名</label>
      <input class="form-input" id="f_office" type="text" placeholder="例：大阪北営業所">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">スタッフ数</label>
        <input class="form-input" id="f_staff" type="number" placeholder="例：5" min="0">
      </div>
      <div class="form-group">
        <label class="form-label">時給（円）</label>
        <input class="form-input" id="f_wage" type="number" placeholder="例：1200" min="0">
      </div>
    </div>
    <hr class="section-divider">
    <div class="form-group">
      <label class="form-label">業務内容（複数可）</label>
      <input class="form-input" id="f_jobs" type="text" placeholder="例：仕分け、ピッキング">
      <div class="job-suggestions" id="jobSuggestions"></div>
    </div>
    <div class="form-group">
      <label class="form-label">業務の詳細・備考</label>
      <textarea class="form-input" id="f_detail" placeholder="例：立ち仕事メイン、冷蔵倉庫のため服装注意、夜勤あり など"></textarea>
    </div>
    <hr class="section-divider">
    <div class="form-group">
      <label class="form-label">就業先 住所 *</label>
      <input class="form-input" id="f_address" type="text" placeholder="例：大阪府大阪市北区梅田1-1-1">
      <button class="geocode-btn" id="geocodeCompanyBtn" onclick="geocodeCompany()">📍 住所から地図上の位置を取得</button>
      <div class="coords-display" id="companyCoords"></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">最寄駅名</label>
        <input class="form-input" id="f_station" type="text" placeholder="例：梅田駅">
      </div>
      <div class="form-group">
        <label class="form-label">徒歩（分）</label>
        <input class="form-input" id="f_walk" type="number" placeholder="例：5" min="0">
      </div>
    </div>
    <div class="form-group">
      <button class="geocode-btn" id="geocodeStationBtn" onclick="geocodeStation()">🚉 駅名から位置を取得</button>
      <div class="coords-display" id="stationCoords"></div>
    </div>
    <div class="form-group">
      <label class="form-label">担当者メモ</label>
      <input class="form-input" id="f_note" type="text" placeholder="例：担当：田中">
    </div>
    <div class="hint">
      💡 住所は「大阪府大阪市〜」のように都道府県から入力すると精度が上がります<br>
      ⚠️ 位置取得にはインターネット接続が必要です
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">キャンセル</button>
      <button id="deleteBtn" class="btn-danger" onclick="deleteCompany()" style="display:none">削除</button>
      <button class="btn-primary" onclick="saveCompany()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
//  ★ パスワードをここで変更できます ★
//  ENTRY_PASSWORD  = ページに入るパスワード（全員共通）
//  ADMIN_PASSWORD  = 編集できる管理者パスワード
// ══════════════════════════════════════════
const ENTRY_PASSWORD = 'riosri';
const ADMIN_PASSWORD = 'admin1234';
// ══════════════════════════════════════════

const STORAGE_KEY = 'kansai_staff_map_v4';
const JOB_PRESETS = ['仕分け','ピッキング','シール貼り','梱包','入出荷','フォークリフト','検品','ラベル貼り','清掃','仕分け・梱包'];

let isAdmin = false;

// ─── 入場パスワード ─────────────────────
function checkEntryPassword() {
  const val = document.getElementById('entryPwInput').value;
  if (val === ENTRY_PASSWORD || val === ADMIN_PASSWORD) {
    document.getElementById('entryScreen').style.display = 'none';
    document.getElementById('mainApp').classList.add('visible');
    if (val === ADMIN_PASSWORD) activateAdmin();
    initMap();
    render();
  } else {
    document.getElementById('entryError').textContent = 'パスワードが違います';
    document.getElementById('entryPwInput').value = '';
    document.getElementById('entryPwInput').focus();
  }
}
function toggleEntryPw() {
  const input = document.getElementById('entryPwInput');
  input.type = input.type === 'password' ? 'text' : 'password';
}

// ─── 管理者ログイン ─────────────────────
function handleAdminClick() {
  if (isAdmin) { deactivateAdmin(); return; }
  document.getElementById('adminPwInput').value = '';
  document.getElementById('adminPwError').textContent = '';
  document.getElementById('adminPwOverlay').classList.add('open');
  setTimeout(() => document.getElementById('adminPwInput').focus(), 100);
}
function checkAdminPassword() {
  const val = document.getElementById('adminPwInput').value;
  if (val === ADMIN_PASSWORD) {
    document.getElementById('adminPwOverlay').classList.remove('open');
    activateAdmin();
    showToast('管理者モードで入りました 🔓');
  } else {
    document.getElementById('adminPwError').textContent = 'パスワードが違います';
    document.getElementById('adminPwInput').value = '';
  }
}
function activateAdmin() {
  isAdmin = true;
  document.getElementById('adminBadge').classList.add('active');
  document.getElementById('adminIcon').textContent = '🔓';
  document.getElementById('adminLabel').textContent = '管理者モード中';
  document.getElementById('addBtn').style.display = 'flex';
  render();
}
function deactivateAdmin() {
  isAdmin = false;
  document.getElementById('adminBadge').classList.remove('active');
  document.getElementById('adminIcon').textContent = '🔒';
  document.getElementById('adminLabel').textContent = '管理者';
  document.getElementById('addBtn').style.display = 'none';
  closeDetail();
  render();
  showToast('ログアウトしました');
}
function closeAdminPwModal() { document.getElementById('adminPwOverlay').classList.remove('open'); }

// ─── データ ─────────────────────────────
function loadData() {
  try { const r = localStorage.getItem(STORAGE_KEY); if(r) return JSON.parse(r); } catch(e) {}
  return [];
}
function saveData() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(companies)); } catch(e) {} }

let companies = loadData();
let map, selectedId = null, editingId = null;
let markers = {}, stationMarkers = {}, lines = {};
let activeFilter = 'all';
let tempCLat = null, tempCLng = null, tempSLat = null, tempSLng = null;

function getAllJobTypes() {
  const all = new Set();
  companies.forEach(c => { if(c.jobs) c.jobs.split(/[、,，\s]+/).forEach(j => { if(j.trim()) all.add(j.trim()); }); });
  return Array.from(all);
}

function initMap() {
  map = L.map('map', { center:[34.75,135.5], zoom:10, zoomControl:false });
  L.control.zoom({ position:'topright' }).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© OpenStreetMap contributors', maxZoom:18
  }).addTo(map);
  map.on('click', () => { closeDetail(); deselectAll(); });
}

async function geocode(query) {
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1&countrycodes=jp`;
  const res = await fetch(url, { headers:{'Accept-Language':'ja'} });
  const data = await res.json();
  if (!data.length) throw new Error('not found');
  return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
}

async function geocodeCompany() {
  const addr = document.getElementById('f_address').value.trim();
  if (!addr) { showToast('住所を入力してください', true); return; }
  const btn = document.getElementById('geocodeCompanyBtn');
  btn.disabled = true; btn.textContent = '取得中…';
  try {
    const { lat, lng } = await geocode(addr);
    tempCLat = lat; tempCLng = lng;
    document.getElementById('companyCoords').textContent = `✅ 取得完了 ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    showToast('就業先の位置を取得しました ✅');
  } catch(e) {
    document.getElementById('companyCoords').textContent = '❌ 見つかりませんでした';
    showToast('住所が見つかりませんでした', true);
  }
  btn.disabled = false; btn.textContent = '📍 住所から地図上の位置を取得';
}

async function geocodeStation() {
  const name = document.getElementById('f_station').value.trim();
  if (!name) { showToast('駅名を入力してください', true); return; }
  const btn = document.getElementById('geocodeStationBtn');
  btn.disabled = true; btn.textContent = '取得中…';
  try {
    const { lat, lng } = await geocode(name + ' 駅 関西');
    tempSLat = lat; tempSLng = lng;
    document.getElementById('stationCoords').textContent = `✅ 取得完了 ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    showToast('駅の位置を取得しました ✅');
  } catch(e) {
    document.getElementById('stationCoords').textContent = '❌ 見つかりませんでした';
    showToast('駅が見つかりませんでした', true);
  }
  btn.disabled = false; btn.textContent = '🚉 駅名から位置を取得';
}

function render() {
  if (!map) return;
  Object.values(markers).forEach(m => map.removeLayer(m));
  Object.values(stationMarkers).forEach(m => map.removeLayer(m));
  Object.values(lines).forEach(l => map.removeLayer(l));
  markers = {}; stationMarkers = {}; lines = {};

  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = companies.filter(c => {
    const mf = activeFilter==='all' || (c.jobs||'').split(/[、,，\s]+/).map(j=>j.trim()).includes(activeFilter);
    const ms = !q || c.name.toLowerCase().includes(q) || (c.office||'').toLowerCase().includes(q) || (c.station||'').includes(q) || (c.jobs||'').includes(q) || (c.detail||'').includes(q);
    return mf && ms;
  });

  filtered.forEach(c => {
    if (!c.lat || !c.lng) return;
    const icon = L.divIcon({
      html:`<div style="width:34px;height:34px;border-radius:50%;background:#4f8ef7;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,0.45);cursor:pointer">🏭</div>`,
      iconSize:[34,34], iconAnchor:[17,17], className:''
    });
    const m = L.marker([c.lat,c.lng],{icon}).addTo(map);
    m.on('click', e => { e.originalEvent.stopPropagation(); selectCompany(c.id); });
    m.bindTooltip(c.name, {permanent:false, direction:'top', offset:[0,-18]});
    markers[c.id] = m;

    if (c.slat && c.slng) {
      const sIcon = L.divIcon({
        html:`<div style="width:22px;height:22px;border-radius:50%;background:#f7c948;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 2px 5px rgba(0,0,0,0.4)">🚉</div>`,
        iconSize:[22,22], iconAnchor:[11,11], className:''
      });
      const sm = L.marker([c.slat,c.slng],{icon:sIcon}).addTo(map);
      sm.on('click', e => { e.originalEvent.stopPropagation(); selectCompany(c.id); });
      sm.bindTooltip(c.station||'駅', {permanent:false, direction:'top', offset:[0,-13]});
      stationMarkers[c.id] = sm;
      const line = L.polyline([[c.lat,c.lng],[c.slat,c.slng]],{color:'#f7c948',weight:1.5,dashArray:'5,6',opacity:0.5}).addTo(map);
      lines[c.id] = line;
    }
  });

  renderList(filtered);
  renderFilters();
  updateStats();
}

function renderFilters() {
  const row = document.getElementById('filterRow');
  const current = activeFilter;
  const jobTypes = getAllJobTypes();
  row.innerHTML = `<button class="filter-btn ${current==='all'?'active':''}" onclick="setFilter('all',this)">すべて</button>`;
  jobTypes.forEach(j => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (current===j?' active':'');
    btn.textContent = j;
    btn.onclick = function() { setFilter(j, this); };
    row.appendChild(btn);
  });
}

function renderList(filtered) {
  const list = document.getElementById('companyList');
  list.innerHTML = '';
  if (!filtered.length) { list.innerHTML = `<div style="text-align:center;color:var(--text-muted);font-size:12px;padding:24px">該当なし</div>`; return; }
  filtered.forEach(c => {
    const jobTags = (c.jobs||'').split(/[、,，\s]+/).filter(Boolean).map(j=>`<span class="tag purple">${j.trim()}</span>`).join('');
    const d = document.createElement('div');
    d.className = 'company-card' + (selectedId===c.id?' selected':'');
    d.dataset.id = c.id;
    d.innerHTML = `
      <div class="card-top">
        <div class="card-icon">🏭</div>
        <div class="card-info">
          <div class="card-name">${c.name}${c.office?` <span style="font-weight:400;font-size:11px;color:var(--text-muted)">／${c.office}</span>`:''}</div>
          <div class="card-station">🚉 ${c.station||'未設定'}${c.walk?` 徒歩${c.walk}分`:''}</div>
        </div>
      </div>
      <div class="card-meta">
        ${jobTags}
        <span class="tag green">👥 ${c.staff||0}名</span>
        ${c.wage?`<span class="tag yellow">💴 ${c.wage.toLocaleString()}円</span>`:''}
      </div>`;
    d.onclick = () => selectCompany(c.id);
    list.appendChild(d);
  });
}

function updateStats() {
  document.getElementById('statTotal').textContent = companies.length;
  document.getElementById('statStations').textContent = new Set(companies.filter(c=>c.station).map(c=>c.station)).size;
}

function selectCompany(id) {
  selectedId = id;
  const c = companies.find(x=>x.id===id);
  if (!c) return;
  document.querySelectorAll('.company-card').forEach(el => el.classList.toggle('selected', parseInt(el.dataset.id)===id));
  if (c.lat && c.lng) map.flyTo([c.lat,c.lng], 14, {duration:0.7});

  const jobTags = (c.jobs||'').split(/[、,，\s]+/).filter(Boolean).map(j =>
    `<span style="display:inline-block;background:rgba(167,139,250,0.15);color:#a78bfa;border-radius:4px;padding:2px 6px;font-size:10px;margin:2px">${j.trim()}</span>`
  ).join('');
  let distText = '';
  if (c.slat && c.slng && c.lat && c.lng) {
    const d = Math.round(map.distance([c.lat,c.lng],[c.slat,c.slng]));
    distText = `<div class="dist-badge">📏 就業先〜駅：約${d}m（徒歩約${c.walk||'?'}分）</div>`;
  }

  document.getElementById('detailContent').innerHTML = `
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:10px">
      <div style="width:38px;height:38px;border-radius:9px;background:#4f8ef7;display:flex;align-items:center;justify-content:center;font-size:17px">🏭</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:700">${c.name}</div>
        ${c.office?`<div style="font-size:11px;color:var(--text-muted)">${c.office}</div>`:''}
        ${c.wage?`<div style="font-size:11px;color:var(--accent2)">💴 時給 ${c.wage.toLocaleString()}円</div>`:''}
      </div>
    </div>
    <hr style="border:none;border-top:1px solid var(--border);margin:8px 0">
    <div class="detail-row"><span class="detail-icon">🔧</span><span class="detail-val">${jobTags||'未設定'}</span></div>
    ${c.detail?`<div class="detail-row"><span class="detail-icon">📋</span><span class="detail-val" style="font-size:11px;color:var(--text-muted)">${c.detail}</span></div>`:''}
    <div class="detail-row"><span class="detail-icon">📍</span><span class="detail-val" style="color:var(--text-muted);font-size:11px">${c.address||'未設定'}</span></div>
    <div class="detail-row"><span class="detail-icon">🚉</span><span class="detail-val">${c.station||'未設定'}${c.walk?` ｜ 徒歩${c.walk}分`:''}</span></div>
    <div class="detail-row"><span class="detail-icon">👥</span><span class="detail-val">スタッフ ${c.staff||0}名</span></div>
    ${c.note?`<div class="detail-row"><span class="detail-icon">📝</span><span class="detail-val">${c.note}</span></div>`:''}
    ${distText}`;

  document.getElementById('detailActions').innerHTML = isAdmin
    ? `<button class="btn-primary" style="font-size:12px;padding:7px" onclick="openEditModal()">✏️ 編集</button>
       <button class="btn-secondary" style="font-size:12px;padding:7px" onclick="closeDetail()">✕ 閉じる</button>`
    : `<button class="btn-secondary" style="font-size:12px;padding:7px;flex:1" onclick="closeDetail()">✕ 閉じる</button>`;

  document.getElementById('detailPanel').style.display = 'block';
  Object.entries(markers).forEach(([mid,m]) => { const el=m.getElement(); if(el) el.style.transform=parseInt(mid)===id?'scale(1.2)':''; });
}

function deselectAll() {
  selectedId = null;
  document.querySelectorAll('.company-card').forEach(el=>el.classList.remove('selected'));
  Object.values(markers).forEach(m=>{const el=m.getElement();if(el)el.style.transform='';});
}
function closeDetail() { document.getElementById('detailPanel').style.display='none'; deselectAll(); }

function buildJobSuggestions() {
  const all = [...new Set([...JOB_PRESETS, ...getAllJobTypes()])];
  const container = document.getElementById('jobSuggestions');
  container.innerHTML = '';
  all.forEach(j => {
    const chip = document.createElement('span');
    chip.className = 'job-chip';
    chip.textContent = j;
    chip.onclick = () => {
      const input = document.getElementById('f_jobs');
      const parts = input.value.trim() ? input.value.split(/[、,，]+/).map(x=>x.trim()).filter(Boolean) : [];
      if (!parts.includes(j)) { parts.push(j); input.value = parts.join('、'); }
    };
    container.appendChild(chip);
  });
}

function openAddModal() {
  if (!isAdmin) return;
  editingId = null;
  tempCLat = tempCLng = tempSLat = tempSLng = null;
  document.getElementById('modalTitle').textContent = '就業先を追加';
  document.getElementById('deleteBtn').style.display = 'none';
  ['name','office','staff','wage','jobs','detail','address','station','walk','note'].forEach(f => { const el=document.getElementById('f_'+f); if(el) el.value=''; });
  document.getElementById('companyCoords').textContent = '';
  document.getElementById('stationCoords').textContent = '';
  buildJobSuggestions();
  document.getElementById('modalOverlay').classList.add('open');
}

function openEditModal() {
  if (!isAdmin || !selectedId) return;
  const c = companies.find(x=>x.id===selectedId);
  if (!c) return;
  editingId = c.id;
  tempCLat = c.lat; tempCLng = c.lng; tempSLat = c.slat; tempSLng = c.slng;
  document.getElementById('modalTitle').textContent = '就業先を編集';
  document.getElementById('deleteBtn').style.display = 'block';
  document.getElementById('f_name').value = c.name||'';
  document.getElementById('f_office').value = c.office||'';
  document.getElementById('f_staff').value = c.staff||'';
  document.getElementById('f_wage').value = c.wage||'';
  document.getElementById('f_jobs').value = c.jobs||'';
  document.getElementById('f_detail').value = c.detail||'';
  document.getElementById('f_address').value = c.address||'';
  document.getElementById('f_station').value = c.station||'';
  document.getElementById('f_walk').value = c.walk||'';
  document.getElementById('f_note').value = c.note||'';
  document.getElementById('companyCoords').textContent = c.lat?`✅ 登録済み ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}`:'';
  document.getElementById('stationCoords').textContent = c.slat?`✅ 登録済み ${c.slat.toFixed(5)}, ${c.slng.toFixed(5)}`:'';
  buildJobSuggestions();
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

function saveCompany() {
  if (!isAdmin) return;
  const name = document.getElementById('f_name').value.trim();
  if (!name) { showToast('会社名を入力してください', true); return; }
  if (!tempCLat || !tempCLng) { showToast('「住所から位置を取得」ボタンを押してください', true); return; }
  const data = {
    name, office: document.getElementById('f_office').value.trim(),
    staff: parseInt(document.getElementById('f_staff').value)||0,
    wage: parseInt(document.getElementById('f_wage').value)||0,
    jobs: document.getElementById('f_jobs').value.trim(),
    detail: document.getElementById('f_detail').value.trim(),
    address: document.getElementById('f_address').value.trim(),
    station: document.getElementById('f_station').value.trim(),
    walk: parseInt(document.getElementById('f_walk').value)||0,
    lat: tempCLat, lng: tempCLng, slat: tempSLat, slng: tempSLng,
    note: document.getElementById('f_note').value.trim()
  };
  if (editingId) { const idx=companies.findIndex(x=>x.id===editingId); companies[idx]={...companies[idx],...data}; }
  else { data.id=Date.now(); companies.push(data); }
  saveData(); closeModal(); render();
  showToast('保存しました ✅');
}

function deleteCompany() {
  if (!isAdmin || !editingId || !confirm('この就業先を削除しますか？')) return;
  companies = companies.filter(x=>x.id!==editingId);
  saveData(); closeModal(); closeDetail(); render();
  showToast('削除しました');
}

function setFilter(val, btn) {
  activeFilter = val;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  render();
}

function showToast(msg, isError=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = isError?'var(--danger)':'var(--border)';
  t.style.color = isError?'var(--danger)':'var(--text)';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => document.getElementById('entryPwInput').focus(), 100);
  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('modalOverlay').addEventListener('click', function(e){if(e.target===this)closeModal();});
  document.getElementById('adminPwOverlay').addEventListener('click', function(e){if(e.target===this)closeAdminPwModal();});
});
</script>
